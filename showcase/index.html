<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#ff8a4c"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,height=1080" />
    <title>Marx — from findings to fixes</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/film.css" />
  </head>
  <body>
    <main
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-duration="44"
    >
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="configure"
        class="clip"
        data-composition-id="configure"
        data-composition-src="compositions/configure.html"
        data-start="5"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="investigate"
        class="clip"
        data-composition-id="investigate"
        data-composition-src="compositions/investigate.html"
        data-start="12"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="handoff"
        class="clip"
        data-composition-id="handoff"
        data-composition-src="compositions/handoff.html"
        data-start="20"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="evidence"
        class="clip"
        data-composition-id="evidence"
        data-composition-src="compositions/evidence.html"
        data-start="28"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="trust"
        class="clip"
        data-composition-id="trust"
        data-composition-src="compositions/trust.html"
        data-start="35"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="40"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <audio
        id="score"
        class="clip"
        data-start="0"
        data-duration="44"
        data-track-index="2"
        src="assets/soundtrack.m4a"
        data-volume="0.7"
        data-fade-in="0.2"
        data-fade-out="1.2"
      ></audio>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap
        .timeline({ paused: true })
        .to({ clock: 0 }, { clock: 44, duration: 44, ease: "none" });
    </script>
  </body>
</html>
