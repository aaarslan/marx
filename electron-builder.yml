appId: com.marx.scanner
productName: Marx
asar: true
toolsets:
  nsis: "1.2.1"
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
dmg:
  title: Marx
  artifactName: Marx-${version}-${arch}.dmg
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - nsis
nsis:
  artifactName: Marx-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
